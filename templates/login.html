<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SECURITY CLEARANCE REQUIRED — CLASSIFIED PORTAL</title>
<link rel="stylesheet" href="/static/css/style.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"/>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(circle at center, #051408 0%, #000000 100%);
    overflow: hidden;
  }
  .login-card {
    width: 90%;
    max-width: 440px;
    background: #020a04;
    border: 1px solid var(--green-dim);
    box-shadow: 0 0 40px rgba(0, 255, 65, 0.2), inset 0 0 20px rgba(0, 255, 65, 0.05);
    border-radius: 6px;
    padding: 30px;
    position: relative;
    z-index: 10;
  }
  .login-card::before {
    content: "RESTRICTED ACCESS // LEVEL 4 CLEARANCE";
    position: absolute;
    top: -10px;
    left: 20px;
    background: #000;
    padding: 2px 8px;
    font-size: 8px;
    color: var(--amber);
    border: 1px solid var(--amber);
    letter-spacing: 2px;
  }
  .login-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .login-badge {
    display: inline-block;
    border: 2px solid var(--red);
    color: var(--red);
    padding: 4px 12px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
    animation: blink-badge 2s infinite;
  }
  .login-title {
    font-family: var(--font-title);
    color: var(--green);
    font-size: 16px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--green-glow);
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1.5px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .form-input {
    width: 100%;
    background: #040e06;
    border: 1px solid var(--border);
    padding: 10px 12px;
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 4px;
    outline: none;
    transition: all 0.2s;
  }
  .form-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .btn-submit {
    width: 100%;
    background: var(--green-dark);
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 10px;
  }
  .btn-submit:hover {
    background: #006b24;
    box-shadow: 0 0 20px var(--green-glow);
  }
  .login-footer {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    text-align: center;
    font-size: 8px;
    color: var(--muted);
    line-height: 1.4;
    letter-spacing: 1px;
  }
  .error-msg {
    color: var(--red);
    font-size: 10px;
    text-align: center;
    margin-bottom: 15px;
    padding: 6px;
    background: rgba(255, 32, 32, 0.1);
    border: 1px solid rgba(255, 32, 32, 0.3);
    letter-spacing: 1px;
    display: none;
  }
  .watermark {
    position: absolute;
    font-family: var(--font-title);
    font-size: 140px;
    color: rgba(0, 255, 65, 0.02);
    user-select: none;
    pointer-events: none;
    transform: rotate(-30deg);
  }
</style>
</head>
<body>

<div class="watermark">CLASSIFIED</div>

<div class="login-card">
  <div class="login-header">
    <div class="login-badge">TOP SECRET // NOFORN</div>
    <div class="login-title">ZMT-INTEL PORTAL</div>
    <div class="login-sub">ZIMBRA SURVEILLANCE & INTERCEPT SYSTEM</div>
  </div>

  <div id="error-box" class="error-msg">ACCESS DENIED: INVALID CREDENTIALS</div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label">OPERATIVE IDENTIFIER (USERNAME)</label>
      <input type="text" id="username" class="form-input" autocomplete="off" required autofocus placeholder="Enter agent ID..."/>
    </div>

    <div class="form-group">
      <label class="form-label">SECURITY PASSCODE (TOKEN/KEY)</label>
      <input type="password" id="password" class="form-input" required placeholder="••••••••••••"/>
    </div>

    <button type="submit" class="btn-submit" id="btn-login">AUTHENTICATE CLEARANCE ▸</button>
  </form>

  <div class="login-footer">
    WARNING: THIS IS A RESTRICTED UNITED STATES GOVERNMENT SYSTEM.<br/>
    UNAUTHORIZED ACCESS IS STRICTLY MONITORED AND SUBJECT TO PROSECUTION.
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const errBox = document.getElementById('error-box');

  btn.textContent = 'VERIFYING CREDENTIALS...';
  btn.disabled = true;
  errBox.style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      btn.textContent = 'ACCESS GRANTED';
      btn.style.borderColor = '#00ff41';
      btn.style.color = '#00ff41';
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    } else {
      errBox.textContent = data.error || 'ACCESS DENIED: INVALID CLEARANCE';
      errBox.style.display = 'block';
      btn.textContent = 'AUTHENTICATE CLEARANCE ▸';
      btn.disabled = false;
    }
  } catch (err) {
    errBox.textContent = 'COMMUNICATION ERROR: SYSTEM UNREACHABLE';
    errBox.style.display = 'block';
    btn.textContent = 'AUTHENTICATE CLEARANCE ▸';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
